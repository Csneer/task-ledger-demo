name: Contract, runtime and release checks

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Contract, Go race/vet/build, Skill, bootstrap and frontend tests
        run: make check
      - name: Install locked browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Isolated browser flow and usability
        run: |
          export CHROME_PATH="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          bash tools/verify-browser.sh runtime/validation/browser-ci
      - name: Build and smoke extracted release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="v$(tr -d '[:space:]' < VERSION)"
          if [[ "$REF_TYPE" == tag ]]; then version="$REF_NAME"; fi
          bash tools/build-release.sh "$version" dist/release
          bash tools/smoke-release.sh dist/release "$version"
      - name: Retain verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence
          path: runtime/validation/browser-ci/
          if-no-files-found: warn
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download this run's verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --repo "$GH_REPO" --name release-artifacts --dir release
      - name: Publish developer preview from verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="$PWD/docs/releases/$RELEASE_TAG.md"
          test -f "$notes"
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --repo "$GH_REPO" --verify-tag --prerelease \
            --title "Task Ledger Demo $RELEASE_TAG — Developer Preview" --notes-file "$notes"
