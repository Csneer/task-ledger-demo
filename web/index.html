<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080e14"><title>Task Ledger · 任务星轨</title><link rel="stylesheet" href="/ui.css"><link rel="stylesheet" href="/graph.css"><script type="module" src="/app.js"></script></head>
<body>
 <header class="chrome"><div class="identity"><a class="wordmark" href="/">task<span>·</span>ledger</a><span class="divider"></span><button id="workspace" class="quiet-button">工作空间 ⌄</button></div><div class="top-actions"><button id="search" class="quiet-button">⌕ <span>搜索任务</span><kbd>⌘ K</kbd></button><button id="create" class="primary">＋ 任务</button><button id="connection" class="connection" aria-label="连接设置"><i></i><span>未连接</span></button></div></header>
 <main><section class="scene-heading"><div><div class="eyebrow">A SPACE FOR WORK IN MOTION</div><h1 id="project-title">让工作，沿着任务继续。</h1><p id="project-caption">人与 Agent 的协作，在这里留下轨迹。</p></div><div class="view-tools"><select id="project-select" aria-label="项目筛选"><option value="">全部项目</option></select><select id="state-select" aria-label="状态筛选"><option value="">全部状态</option><option value="attention">待处理</option><option value="offered">待领取</option><option value="claimed">已领取</option><option value="active">执行中</option><option value="submitted">待验收</option><option value="completed">已完成</option><option value="rejected">已拒绝</option><option value="failed">执行失败</option><option value="cancelled">已取消</option></select></div></section>
 <nav id="scope-tools" class="scope-tools" aria-label="任务视图范围" hidden><span id="view-context">任务链总览</span><button id="back-overview" hidden>← 总览</button><button id="back-chain" hidden>返回任务链</button><button id="choose-chain">选择任务链 ⌄</button><button id="choose-focus" hidden>选择任务 ⌄</button><select id="activity-select" aria-label="实施范围"><option value="all">全部任务链</option><option value="worked">有实施记录</option><option value="unstarted">尚未承接</option></select><span id="overview-pages" hidden><button id="overview-prev" aria-label="上一页任务链">‹</button><span id="overview-page"></span><button id="overview-next" aria-label="下一页任务链">›</button></span></nav>
  <div id="notice" role="status" hidden></div><div id="graph" aria-label="任务流转画布"></div><div id="empty" class="empty" hidden><div class="empty-orbit">◎</div><h2>一个目标，一条新的轨迹。</h2><p>发布第一项任务，再由人与 Agent 接续完成。</p><button id="empty-reset" class="quiet-button" hidden>清除筛选</button><button id="empty-create" class="primary">发布任务</button></div>
 </main>
 <footer class="event-bar"><button id="timeline" class="event-button"><span class="event-dot"></span><span id="event-label">等待连接任务服务</span></button><div><button id="pending" hidden>核对未确认操作</button><button id="batch-resume" hidden>继续发布尝试</button><button id="refresh" class="quiet-button">↻ 刷新</button></div></footer>
 <dialog id="dialog"><div id="dialog-content"></div></dialog><div id="toast" role="status" hidden></div>
</body></html>
